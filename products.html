<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johar Horizons | Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
</head>
<body>
    <!-- Header Area (Same as your existing layout) -->
    <header class="header">
        <div class="header-brand" href="index.html">
            <div><img src="assets/logos/JH-Logo-V2-White.png" class="mini-logo"></div>
            <span style="font-weight: bold;">JOHAR <b>HORIZONS
            
            </b></span>
        </div>
        
        <nav class="header-nav" id="navMenu">
    <!-- Mobile Profile Block -->
<div id="mobileAuthBlock" class="mobile-user-profile" style="display: none; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 15px;">
        <img src="" id="mobilePfp" class="user-pfp" alt="User" style="width: 45px; height: 45px; border-radius: 50%;">
        <div class="user-info" style="text-align: left;">
            <h4 id="mobileUserName" style="margin: 0; color: var(--green);">Loading...</h4>
            <p id="mobileEmail" style="font-size: 0.75rem; color: var(--muted); margin: 0;"></p>
        </div>
    </div>
    
    <!-- Action Links -->
<div style="display: flex; flex-direction: row; gap: 8px; margin-top: 10px; width: 100%;">
    <a href="profile.html" class="btn btn-outline" style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; padding: 0 8px; white-space: nowrap;">
        <i class="ri-user-settings-line"></i> Manage
    </a>
    <a href="profile.html#my-orders" class="btn btn-outline" style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; padding: 0 8px; white-space: nowrap;">
        <i class="ri-box-3-line"></i> Orders
    </a>
</div>

    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="labs.html" class="nav-link menu-item">Apps &amp; Tools</a>
    <a href="about.html">About</a>
    <a href="index.html#contact">Contact</a>
    <a href="auth.html" id="navLoginLink">Login / Sign Up</a>
    
    <!-- Naya Script Studio Bubble Capsule -->
    <a href="https://joharscriptstudio.netlify.app/index.html" class="script-studio-bubble" target="_blank">
        Explore Script Studio <i class="ri-arrow-right-up-line"></i>
    </a>

    <!-- Mobile Logout (As is) -->
    <a href="#" id="mobileLogoutBtn" style="display: none; color: #ff4444; margin-top: 10px;">
        <i class="ri-logout-circle-line"></i> Logout
    </a>
</nav>

        <div class="header-actions">
            <i class="ri-search-line icon-btn"></i>
            <div class="cart-wrapper icon-btn">
                <i class="ri-shopping-cart-2-line"></i>
                <span class="cart-badge"></span>
            </div>
            
            <!-- Get Started Button Linked to auth.html -->
            <a href="auth.html" id="loginBtn" class="btn btn-outline">Get Started</a>
            
            <!-- Desktop User Badge (Hidden by default) -->
            <a href="profile.html" id="desktopUserBadge" class="user-badge" style="display: none; align-items: center; gap: 8px;">
                <img src="" id="desktopPfp" class="user-pfp-small" alt="Profile" style="width: 32px; height: 32px; border-radius: 50%;">
                <span id="desktopUserName">Profile</span>
            </a>
            
            <i class="ri-menu-line mobile-menu-btn"></i>
        </div>
    </header>

    <main style="padding-top: 100px; min-height: 80vh;">
        <section class="products-section">
            <div class="section-header">
                <div>
                    <p class="section-label">JOHAR SHOP</p>
                    <h2>Explore Products</h2>
                </div>
            </div>

            <!-- Dynamic Filters -->
            <div class="filter-section">
                <select id="branchFilter" class="filter-select">
                    <option value="all">Loading Branches...</option>
                </select>
                <select id="categoryFilter" class="filter-select">
                    <option value="all">Loading Categories...</option>
                </select>
            </div>

            <!-- Product Grid -->
            <div class="dynamic-products-grid" id="productsGrid">
                <h2 style="grid-column: 1/-1; color: var(--muted);">Loading Products <i class="ri-loader-4-line ri-spin"></i></h2>
            </div>
        </section>
    </main>

    <!-- Footer Area (Same as your existing layout) -->
    <footer class="footer-area">
        <div class="footer-grid">
            <div class="footer-col brand-col">
                <div class="footer-logo"><img src="assets/logos/JH-Logo-V2-White.png" class="footer-logo" alt="Johar Horizons Logo"></div>
                <h2 class="footer-brand-name">JOHAR <span>HORIZONS</span></h2>
                <p class="copyright">&copy; 2026 Johar Horizons.<br>All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/products.js"></script>
    <script src="js/script.js"></script>
    <script type="module" src="js/ui.js"></script>
</body>
</html>
