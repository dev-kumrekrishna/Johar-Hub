<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johar Hub | Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Custom Styles for Filters & Grid */
        .filter-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filter-select {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            font-family: inherit;
            outline: none;
            min-width: 180px;
            cursor: pointer;
            transition: 0.3s;
        }
        .filter-select:focus, .filter-select:hover {
            border-color: var(--green);
        }
        .filter-select option {
            background: var(--dark);
            color: white;
        }
        .dynamic-products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Header Area (Same as your existing layout) -->
    <header class="header">
        <div class="header-brand" href="index.html">
            <div><img src="assets/logos/JH-Logo-White.png" class="mini-logo" alt="Johar Hub"></div>
            <span style="font-weight: bold;">JOHAR <b>HUB</b></span>
        </div>
        
        <nav class="header-nav" id="navMenu">
            <a href="index.html">Home</a>
            <a href="products.html" class="active">Products</a>
            <a href="about.html">About</a>
            <a href="index.html#contact">Contact</a>
            <a href="auth.html" id="navLoginLink">Login / Sign Up</a>
        </nav>

        <div class="header-actions">
            <div class="cart-wrapper icon-btn">
                <i class="ri-shopping-cart-2-line"></i>
                <span class="cart-badge"></span>
            </div>
            <a href="auth.html" id="loginBtn" class="btn btn-outline">Get Started</a>
            <a href="profile.html" id="desktopUserBadge" class="user-badge" style="display: none; align-items: center; gap: 8px;">
                <img src="" id="desktopPfp" class="user-pfp-small" alt="Profile" style="width: 32px; height: 32px; border-radius: 50%;">
                <span id="desktopUserName">Profile</span>
            </a>
            <i class="ri-menu-line mobile-menu-btn"></i>
        </div>
    </header>

    <main style="padding-top: 100px; min-height: 80vh;">
        <section class="products-section">
            <div class="section-header">
                <div>
                    <p class="section-label">JOHAR SHOP</p>
                    <h2>Explore Products</h2>
                </div>
            </div>

            <!-- Dynamic Filters -->
            <div class="filter-section">
                <select id="branchFilter" class="filter-select">
                    <option value="all">Loading Branches...</option>
                </select>
                <select id="categoryFilter" class="filter-select">
                    <option value="all">Loading Categories...</option>
                </select>
            </div>

            <!-- Product Grid -->
            <div class="dynamic-products-grid" id="productsGrid">
                <h2 style="grid-column: 1/-1; color: var(--muted);">Loading Products <i class="ri-loader-4-line ri-spin"></i></h2>
            </div>
        </section>
    </main>

    <!-- Footer Area (Same as your existing layout) -->
    <footer class="footer-area">
        <div class="footer-grid">
            <div class="footer-col brand-col">
                <div class="footer-logo"><img src="assets/logos/JH-Logo-White.png" class="footer-logo" alt="Johar Hub Logo"></div>
                <h2 class="footer-brand-name">JOHAR <span>HUB</span></h2>
                <p class="copyright">&copy; 2026 Johar Hub.<br>All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/products.js"></script>
    <script src="js/script.js"></script>
    <script type="module" src="js/ui.js"></script>
</body>
</html>
